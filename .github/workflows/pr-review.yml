name: Pull Request Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Install Dependencies
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      # Step 3: Fetch Pull Request Diff
      - name: Fetch Pull Request Diff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -H "Accept: application/vnd.github.v3.diff" \
            -H "Authorization: token $GITHUB_TOKEN" \
            ${{ github.event.pull_request.url }} \
            -o all-changes.diff

      # Step 4: Log Diff Content (for debugging)
      - name: Log All Changes
        run: |
          echo "Consolidated Changes:"
          cat all-changes.diff

      # Step 5: Call AI Model API
      - name: Call AI Model API with Retry
        env:
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
        run: |
          DIFF=$(cat all-changes.diff)
          MAX_RETRIES=5
          RETRY_COUNT=0
          SLEEP_INTERVAL=30
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            RESPONSE=$(curl -X POST https://api-inference.huggingface.co/models/microsoft/codebert-base \
              -H "Authorization: Bearer $HF_API_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"inputs\": \"$DIFF\"}")
            if echo "$RESPONSE" | grep -q '"error":"Model .* is currently loading"'; then
              echo "Model is loading. Retrying in $SLEEP_INTERVAL seconds..."
              sleep $SLEEP_INTERVAL
              RETRY_COUNT=$((RETRY_COUNT+1))
            else
              echo $RESPONSE > review.json
              break
            fi
          done
          if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
            echo "Error: Model did not load in time."
            exit 1
          fi

      # Step 6: Validate AI Model Response
      - name: Validate AI Model Response
        run: |
          cat review.json
          if ! jq empty review.json; then
            echo "Error: Invalid JSON response from AI model."
            cat review.json
            exit 1
          fi

      # Step 7: Post Review Comments
      - name: Post Review Comments
        run: |
          COMMENTS=$(cat review.json | jq -r '.comments | .[] | "\(.path):\(.line) - \(.text)"')
          for COMMENT in $COMMENTS; do
            curl -X POST \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -d "{\"body\": \"$COMMENT\"}" \
              ${{ github.event.pull_request.review_comments_url }}
          done

      # Step 8: Save Diff File as Artifact (Optional)
      - name: Upload Diff as Artifact
        uses: actions/upload-artifact@v3
        with:
          name: pull-request-diff
          path: all-changes.diff

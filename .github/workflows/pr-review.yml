name: Pull Request Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Fetch Pull Request Files
        run: echo "${{ github.event.pull_request.head.ref }}" > pr-branch.txt

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: Debug GitHub API Response
        run: |
          curl -H "Accept: application/vnd.github.v3.diff" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            ${{ github.event.pull_request.url }}/files \
            -o pr-diff.diff
          cat pr-diff.diff

      - name: Clean and Escape Diff Content
        run: |
          # Clean DIFF content by removing control characters
          DIFF=$(cat pr-diff.diff | tr -cd '\11\12\15\40-\176')
          
          # Escape the DIFF content for safe JSON input
          ESCAPED_DIFF=$(echo "$DIFF" | jq -Rs .)
          CLEANED_RESPONSE=$(echo "$ESCAPED_DIFF" | tr -cd '\11\12\15\40-\176')
          echo "Escaped Diff: $CLEANED_RESPONSE"  # Debug

      - name: Call AI Model API
        env:
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
        run: |
          # Send cleaned and escaped DIFF to the Hugging Face API
          RESPONSE=$(curl -X POST https://api-inference.huggingface.co/models/facebook/bart-large-cnn \
            -H "Authorization: Bearer $HF_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"inputs\": $CLEANED_RESPONSE}")
          
          # Save the response to a file for debugging
          echo "Raw Response: $RESPONSE"  # Debugging the raw response
          echo $RESPONSE > review.json

      - name: Check and Parse Response
        run: |
          # Check if the response is valid JSON
          if ! echo "$RESPONSE" | jq empty; then
            echo "Invalid JSON response: $RESPONSE"
            exit 1
          fi
          
          # Parse the 'generated_text' from the valid JSON response
          GENERATED_TEXT=$(cat review.json | jq -r '.[0].summary_text')
          echo "Generated Review: $GENERATED_TEXT"  # Debug
          
          # Post each comment from the generated text as review comments
          COMMENTS=$(echo "$GENERATED_TEXT" | jq -r '.comments | .[] | "\(.path):\(.line) - \(.text)"')
          for COMMENT in $COMMENTS; do
            curl -X POST \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -d "{\"body\": \"$COMMENT\"}" \
              ${{ github.event.pull_request.review_comments_url }}
          done
